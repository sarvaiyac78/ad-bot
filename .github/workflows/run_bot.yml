name: Run Daily Ad Bot

on:
  workflow_dispatch:        # Allows manual triggering anytime
  repository_dispatch:     # Listens for auto-restart events from previous runs
    types: [rerun_ad_bot]

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # Gracefully stops at ~5.6 hours to save videos before timeout
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python & VNC Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify

      - name: Start Live Web VNC Stream
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          
          x11vnc -display :99 -forever -shared -rfbport 5900 -nopw &
          sleep 2
          
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 2
          
          ssh -p 443 -R0:localhost:6080 -o StrictHostKeyChecking=no a.pinggy.io > pinggy.log 2>&1 &
          sleep 5
          
          BASE_URL=$(cat pinggy.log | grep -o 'https://[^" ]*' | head -n 1)
          echo "=========================================================="
          echo "LIVE STREAM URL:"
          echo "${BASE_URL}/vnc.html"
          echo "=========================================================="

      - name: Run Script
        env:
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          DISPLAY: ":99"
        run: python -u bot.py

      - name: Upload Execution Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-videos-${{ github.run_number }}
          path: videos/
          retention-days: 7

      - name: Trigger Next Run (Auto-Chain)
        if: always() # Automatically triggers the next run when this job finishes
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: rerun_ad_bot
